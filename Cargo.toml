[workspace]
resolver = "3"
members = [
    "crates/framework/common",
    "crates/framework/database",
    "crates/framework/mq",
    "crates/framework/redis",
    "crates/framework/security",
    "crates/framework/telemetry",
    "crates/framework/tofu",
    "crates/framework/gm",
    "crates/framework/tenant",
    "crates/framework/web",
    "crates/modules/infra-api",
    "crates/modules/infra-server",
    "crates/modules/ai-api",
    "crates/modules/cmdb-api",
    "crates/modules/cmdb-server",
    "crates/modules/ai-server",
    "crates/modules/system-api",
    "crates/modules/system-server",
    "services/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.com/rustset"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["multipart"] }
aide = { version = "0.15", features = ["axum", "axum-json", "axum-query", "axum-form", "axum-multipart"] }
schemars = "0.9"
indexmap = "2"
calamine = "0.36"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
redis = { version = "0.32", default-features = false, features = ["aio", "tokio-comp"] }
rust_xlsxwriter = "0.96"
rustset-framework-common = { path = "crates/framework/common" }
rustset-framework-database = { path = "crates/framework/database" }
rustset-framework-mq = { path = "crates/framework/mq" }
rustset-framework-redis = { path = "crates/framework/redis" }
rustset-framework-security = { path = "crates/framework/security" }
rustset-framework-telemetry = { path = "crates/framework/telemetry" }
rustset-framework-tofu = { path = "crates/framework/tofu" }
rustset-framework-gm = { path = "crates/framework/gm" }
rustset-framework-tenant = { path = "crates/framework/tenant" }
rustset-framework-web = { path = "crates/framework/web" }
rustset-infra-api = { path = "crates/modules/infra-api" }
rustset-infra-server = { path = "crates/modules/infra-server" }
rustset-ai-api = { path = "crates/modules/ai-api" }
rustset-cmdb-api = { path = "crates/modules/cmdb-api" }
rustset-cmdb-server = { path = "crates/modules/cmdb-server" }
rustset-ai-server = { path = "crates/modules/ai-server" }
rustset-system-api = { path = "crates/modules/system-api" }
rustset-system-server = { path = "crates/modules/system-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.4"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.16", features = ["v4"] }
zip = "8.6"
