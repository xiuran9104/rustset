# TLCP 国密入口网关配置（docs/xinchuang-adaptation-plan.md §4.4.3 #1）。
#
# 目标平台：Tengine 3.x / nginx + Tongsuo（编译期 --with-ntls，铜锁 enable-ntls）。
# 证书由 script/tlcp/gen-sm2-certs.sh 生成（SM2 签名 + SM2 加密双证书，
# GB/T 38656 NTLS 结构）。
#
# 挂载：
#   ./certs:/etc/rustset/tlcp:ro
# 上游：宿主网关 127.0.0.1:8080（gateway 保持原样，无需国密改造）。

server {
    listen 443 ssl;
    server_name rustset.local;

    # NTLS/TLCP 双证书（签名域 + 加密域）。
    ssl_ntls on;
    ssl_certificate     /etc/rustset/tlcp/server-sign.crt;
    ssl_certificate_key /etc/rustset/tlcp/server-sign.key;
    ssl_enc_certificate /etc/rustset/tlcp/server-enc.crt;
    ssl_enc_certificate_key /etc/rustset/tlcp/server-enc.key;

    # TLCP 套件（铜锁命名）+ TLS1.3 国密套件兜底。
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-SM4-CBC-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-SM2-SM4-GCM-SM3:TLS_SM4_GCM_SM3:TLS_SM4_CCM_SM3;
    ssl_prefer_server_ciphers on;

    # 明文 HTTP 不自动降级（故障时宁可失败，§4.4.3 #7）。
    ssl_verify off;

    # 前端静态资源与 API 反代（§4.4.3 #1：应用代码不动）。
    root /opt/rustset/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
