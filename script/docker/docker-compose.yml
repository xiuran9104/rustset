services:
  postgres:
    image: postgres:18
    container_name: rustset-postgres
    environment:
      POSTGRES_USER: rustset
      POSTGRES_PASSWORD: rustset
      POSTGRES_DB: rustset
    ports:
      - "5432:5432"
    volumes:
      - rustset-postgres:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: rustset-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    container_name: rustset-nats
    ports:
      - "4222:4222"
      - "8222:8222"

  rustfs:
    # MinIO is unmaintained; RustFS is the S3-compatible replacement.
    # S3 API on 9000, web console on 9001, data dir /data. The image ships
    # /data owned by the container user, so a fresh named volume inherits
    # writable ownership without a permission helper.
    image: rustfs/rustfs:1.0.0
    container_name: rustset-rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustset}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustset_password}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustset-rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  rustset-postgres:
  rustset-rustfs:
